<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>9yards NIDS</title>
  <link rel="stylesheet" href="/css/app.css?v=10" />
</head>
<body>
  <header class="brandbar">
    <div class="brand">
      <span class="logo">9Y</span>
      <div>
        <div class="title">9yards NIDS</div>
        <div class="subtitle">Packet · Flow · IDS · Stats</div>
      </div>
    </div>
    <span id="demo-flag" class="demo-flag off">DEMO</span>
    <span id="health-pill" class="pill info">…</span>
    <button id="btn-live" class="ghost">Start live</button>
  </header>

  <div class="filterbar" id="filterbar">
    <label class="ctl">Interface <select id="global-iface"></select></label>
    <label class="ctl">BPF <select id="global-bpf"></select></label>
    <label class="ctl hidden" id="bpf-custom-wrap">Custom BPF <input id="global-bpf-custom" placeholder="tcp port 443" /></label>
    <div class="timepicker" id="timepicker">
      <button data-range="5m">5m</button>
      <button data-range="15m" class="on">15m</button>
      <button data-range="1h">1h</button>
      <button data-range="6h">6h</button>
      <button data-range="24h">24h</button>
    </div>
    <label class="ctl">IP <input id="g-ip" placeholder="10.0.0.10" /></label>
    <label class="ctl">Port <input id="g-port" type="number" placeholder="443" /></label>
    <label class="ctl">Protocol <select id="g-proto"><option value="">Any</option><option>TCP</option><option>UDP</option><option>ICMP</option><option>ARP</option></select></label>
    <label class="ctl searchwrap" style="flex:1;min-width:180px">Search <input id="q" type="search" placeholder="IP, signature, SNI…" /></label>
    <label class="chk"><input type="checkbox" id="autorefresh" checked /> Live</label>
    <label class="ctl">Interval
      <select id="refresh-interval">
        <option value="5000" selected>5s</option>
        <option value="10000">10s</option>
        <option value="15000">15s</option>
      </select>
    </label>
  </div>

  <nav class="tabs" id="tabs"></nav>
  <nav class="subtabs" id="subtabs"></nav>
  <div id="banner" class="banner hidden"></div>
  <main id="main" class="main"></main>

  <aside id="drawer" class="drawer" aria-hidden="true">
    <header>
      <strong id="drawer-title">Inspect</strong>
      <button id="drawer-close" class="ghost">Close</button>
    </header>
    <div class="body" id="drawer-body"></div>
  </aside>

  <footer class="statusbar">
    <span id="sb-iface">iface —</span>
    <span id="sb-pps">pps —</span>
    <span id="sb-bps">bps —</span>
    <span id="sb-drops">drops —</span>
    <span id="sb-bind">bind 127.0.0.1</span>
    <span id="sb-ws">ws …</span>
    <span>Ctrl+1–9  [ ] tabs</span>
  </footer>
  <div id="chart-tip"></div>

  <script src="/js/charts.js?v=10"></script>
  <script src="/js/api.js?v=10"></script>
  <script src="/js/app.js?v=10"></script>
</body>
</html>
